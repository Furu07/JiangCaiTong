<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://i.ilife798.com/api/v1/captcha/; base-uri 'none'; form-action 'none'">
  <title>酱菜通 · JiangCaiTong</title>
  <link rel="stylesheet" href="app.css">
  <script defer src="native.js"></script>
  <script defer src="academic.js"></script>
  <script defer src="jufe-academic.js"></script>
  <script defer src="learning.js"></script>
  <script defer src="water.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div id="app">
    <main class="page" id="page-schedule">
      <header class="pagehead"><h1>课表</h1><button class="btn" id="scheduleSync">同步示例</button></header>
      <div class="scroll">
        <div class="card pad">
          <label for="term">示例学期</label>
          <select id="term"></select>
          <p class="sub" id="scheduleStatus" role="status">正在读取课表…</p>
          <div class="controls">
            <button class="btn" id="previousWeek">上一周</button>
            <select id="week" aria-label="教学周"></select>
            <button class="btn" id="nextWeek">下一周</button>
          </div>
          <div class="controls">
            <button class="btn" id="weekView" aria-pressed="true">周视图</button>
            <button class="btn" id="dayView" aria-pressed="false">日视图</button>
            <select id="day" aria-label="星期" hidden></select>
          </div>
        </div>
        <div id="schedule"></div>
        <section class="card pad">
          <h2>江财本科教务</h2>
          <p class="sub">在系统浏览器打开官方入口。酱菜通的个人课表对接等待授权样本。</p>
          <button class="btn" id="academicOfficial">打开学校官方教务</button>
        </section>
      </div>
    </main>
    <main class="page" id="page-study" hidden>
      <header class="pagehead"><h1>学习</h1></header>
      <div class="scroll">
        <div class="card pad">
          <h2>超星学习通</h2>
          <p class="sub" id="studyStatus" role="status"></p>
          <div class="controls">
            <button class="btn primary" id="studyLogin">打开官方登录页</button>
            <button class="btn" id="studyRefresh" disabled>查询课程</button>
          </div>
        </div>
        <div id="studyCourses"></div>
        <div id="studyDetails"></div>
      </div>
    </main>
    <main class="page" id="page-life" hidden>
      <header class="pagehead"><h1>生活</h1></header>
      <div class="scroll">
        <div class="card pad">
          <h2>慧生活798</h2>
          <p class="sub" id="waterStatus" role="status"></p>
          <div class="controls">
            <button class="btn primary" id="waterLoginOpen">手机验证码登录</button>
            <button class="btn" id="waterRefresh" hidden>刷新余额与设备</button>
          </div>
          <form id="waterForm" autocomplete="off" hidden>
            <label>手机号<input id="phone" inputmode="numeric" type="tel" maxlength="11" required></label>
            <label>图形验证码<input id="graph" maxlength="12"></label>
            <div class="controls">
              <img id="captcha" width="100" height="38" alt="慧生活图形验证码" hidden>
              <button class="btn" type="button" id="loadCaptcha">加载验证码</button>
              <button class="btn" type="button" id="sendSms">发送短信</button>
            </div>
            <label>短信验证码<input id="sms" inputmode="numeric" maxlength="10" required></label>
            <div class="controls">
              <button class="btn primary" type="submit" id="waterLogin">登录</button>
              <button class="btn" type="button" id="waterLoginCancel">收起</button>
            </div>
          </form>
        </div>
        <div id="waterResults" hidden>
          <section class="card pad"><h2>余额</h2><p id="balance" class="value">—</p></section>
          <section class="card pad"><h2>设备</h2><p class="sub" id="deviceStatus"></p><div id="devices"></div></section>
          <section class="card pad">
            <h2>消费记录</h2>
            <p class="sub" id="billStatus" role="status"></p>
            <div id="bills"></div>
            <div class="controls">
              <button class="btn" id="billRefresh">查询记录</button>
              <button class="btn" id="billMore" hidden>加载更多</button>
            </div>
          </section>
        </div>
      </div>
    </main>
    <main class="page" id="page-me" hidden>
      <header class="pagehead"><h1>我的</h1></header>
      <div class="scroll">
        <section class="card pad">
          <h2>服务账号</h2>
          <p class="sub" id="studyAccount"></p>
          <button class="btn" id="studyAccountAction"></button>
          <p class="sub" id="waterAccount"></p>
          <button class="btn" id="waterAccountAction"></button>
        </section>
        <section class="card pad">
          <h2>酱菜通 · JiangCaiTong</h2>
          <p>江西财经大学非官方 Android 校园助手。</p>
          <p class="sub">基于航院通二次开发。MIT License · Copyright © 2026 Hobson</p>
          <p class="sub" id="appVersion"></p>
          <button class="btn" id="clearWebCache">清理网页缓存</button>
        </section>
      </div>
    </main>
    <nav class="tabbar" aria-label="底部导航">
      <button class="tab active" data-tab="schedule" aria-current="page">课表</button>
      <button class="tab" data-tab="study">学习</button>
      <button class="tab" data-tab="life">生活</button>
      <button class="tab" data-tab="me">我的</button>
    </nav>
    <div class="sheet-mask" id="sheetMask" hidden>
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
        <button type="button" class="sheet-x" id="sheetClose" aria-label="关闭">×</button>
        <h2 id="detailTitle"></h2>
        <div id="detailBody"></div>
      </section>
    </div>
    <div class="toast" id="toast" role="status" hidden></div>
  </div>
</body>
</html>
